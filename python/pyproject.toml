[project]
name = "ai-run-demo-agents"
version = "0.1.0"
description = "Agent2Agent samples for CodeMie"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "httpx-sse>=0.4.0",
    "jwcrypto>=1.5.6",
    "langchain-community>=0.3.24",
    "langchain-openai>=0.2.14",
    "langgraph>=0.4.1",
    "pydantic>=2.10.6",
    "pyjwt>=2.10.1",
    "pyngrok>=5.1.0",
    "sse-starlette>=2.2.1",
    "starlette>=0.46.1",
    "typing-extensions>=4.12.2",
    "uvicorn>=0.34.0",
]

[tool.hatch.build.targets.wheel]
packages = ["common", "hosts"]

[tool.pytest.ini_options]
# This repo has no pytest-based test suite today — only per-agent manual A2A
# smoke scripts (agents/*/test_client.py), each meant to be run standalone as
# `uv run test_client.py` from its own agent directory/uv environment (see each
# agent's README). Without this, root-level `uv run pytest` auto-discovers
# those scripts by their test_*.py naming and fails to collect them, since
# they import `common`/`a2a` packages that only exist in each agent's own
# isolated workspace-member environment, not the root one. Ignore them by
# glob so default discovery collects nothing until a real pytest suite is
# added under a dedicated tests/ directory. With 0 tests legitimately
# collected, plain pytest would exit 5 ("no tests collected"); the
# pytest-custom-exit-code plugin's --suppress-no-test-exit-code makes that
# exit 0 instead, since having no pytest suite is intentional here, not a
# failure.
addopts = "--ignore-glob=agents/*/test_client.py --suppress-no-test-exit-code"

[tool.uv.workspace]
members = [
    "agents/currency_converter",
    "agents/fun-with-rick",
    "agents/financial-agent",
    "agents/research-agent",
    "agents/text-insights-agent",
    "agents/howto-guide-agent",
    "agents/codemie-caller-agent",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-custom-exit-code>=0.3.0",
]
