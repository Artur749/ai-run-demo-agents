[project]
name = "howto-guide-agent"
version = "0.1.0"
description = "Sample streaming how-to-guide agent built on the official a2a-sdk"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[http-server]>=1.1.5",
    "click>=8.1.8",
    "langchain-openai>=0.2.14",
    "pydantic>=2.10.6",
    "python-dotenv>=1.1.0",
    "uvicorn>=0.34.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
